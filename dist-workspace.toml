[workspace]
# The cargo crate lives in the rust-memory/ subdirectory; this config sits at the
# git root so cargo-dist's CI (which runs `dist host` from the repo root) finds it.
members = ["cargo:rust-memory"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. `shell` is the curl|sh installer; a
# cargo-dist GitHub Release is also auto-discovered by `cargo-binstall`. (Homebrew
# is intentionally left out for now — it needs a separate tap repo + CI token.)
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax). macOS + Linux
# only: the server shells out to a local llama-server and uses Unix paths, so a
# Windows build would not work.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
