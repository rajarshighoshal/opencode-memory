# Merge into ~/.codex/config.toml. Replace {{MEMORY_MCP}}, {{GLOBAL_DIR}}, {{GLOBAL_DB}}
# with the values install.sh prints. Some Codex versions use `mcp.servers` instead of
# `mcp_servers` — check `codex --help` or your existing config if the block is ignored.

[mcp_servers.memory-global]
command = "{{MEMORY_MCP}}"
args = ["global"]

[mcp_servers.memory-global.env]
MCP_MEMORY_BASE_DIR = "{{GLOBAL_DIR}}"
MCP_MEMORY_SQLITE_PATH = "{{GLOBAL_DB}}"
MCP_EXTERNAL_EMBEDDING_URL = "http://localhost:11434/v1/embeddings"
MCP_EXTERNAL_EMBEDDING_MODEL = "qwen3-embedding-4b"

[mcp_servers.memory-project]
command = "{{MEMORY_MCP}}"
args = ["project"]

[mcp_servers.memory-project.env]
MCP_MEMORY_BASE_DIR = "./.opencode-memory"
MCP_MEMORY_SQLITE_PATH = "./.opencode-memory/project.db"
MCP_EXTERNAL_EMBEDDING_URL = "http://localhost:11434/v1/embeddings"
MCP_EXTERNAL_EMBEDDING_MODEL = "qwen3-embedding-4b"
